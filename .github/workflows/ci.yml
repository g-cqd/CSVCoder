name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        type: boolean
        default: false
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODE_VERSION: '26.6'

jobs:
  # swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci): quality (swift-format,
  # SwiftLint, the library discipline, the analyzers against .ci/baselines), the macOS debug tests on Swift 6.4.1 and
  # 6.3.3, the release tests, and the iOS, macOS, tvOS, watchOS and visionOS builds. `.ci/swift-ci local` runs the same
  # checks on a developer's machine. The jobs after it are this package's own: release, benchmarks and documentation.
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@c930444a6f6f462ddce3fbad7df9f8e2acc3e04b # swift-ci c930444
    permissions:
      contents: write # reusable publish permission; releases are this workflow's own jobs

  formal:
    name: Verification · TLA+ & Lean · Linux
    # Re-checks Formal/: the streaming protocol in TLC (the broken design must still deadlock, the shipped one
    # must hold) and the SWAR proofs in Lean. Pinned in Scripts/formal.sh and Formal/lean-toolchain.
    runs-on: ubuntu-latest
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Setup · Install Lean (elan)
        run: |
          curl -fsSL --retry 3 -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          # elan v4.2.4, by commit
          sh elan-init.sh -y --default-toolchain "$(cat Formal/lean-toolchain)" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verification · Check the Models
        run: Scripts/formal.sh

  prepare-release:
    name: Release · Prepare
    runs-on: macos-26
    needs: ci
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.author.name, 'github-actions'))
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release · Determine Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -f ".version" ]]; then
            VERSION="$(tr -d '[:space:]' < .version)"
          else
            echo "No version source found"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag-push trigger for ${TAG} - will create release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} - will create release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release · Generate Changelog
        id: changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${PREVIOUS:+$PREVIOUS..}HEAD"

          {
            echo "content<<EOF"

            FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" --grep="^add" --grep="^new" -i 2>/dev/null | head -20 || echo "")
            if [[ -n "$FEATURES" ]]; then
              echo "### Features"
              echo "$FEATURES"
              echo ""
            fi

            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" -i 2>/dev/null | head -20 || echo "")
            if [[ -n "$FIXES" ]]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            PERF=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^perf" -i 2>/dev/null | head -10 || echo "")
            if [[ -n "$PERF" ]]; then
              echo "### Performance"
              echo "$PERF"
              echo ""
            fi

            OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^perf" --grep="^add" --grep="^new" -i 2>/dev/null | head -15 || echo "")
            if [[ -n "$OTHER" ]]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  benchmarks:
    name: Performance · Benchmarks · macOS
    runs-on: macos-26
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Setup · Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache · Restore SwiftPM
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: csvcoder-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: csvcoder-${{ github.job }}-${{ runner.os }}-

      - name: Performance · Run Benchmarks
        id: run
        run: |
          swift run -c release CSVCoderBenchmarks --iterations 3 2>&1 | tee benchmark_output.txt

          {
            echo 'summary<<EOF'
            head -100 benchmark_output.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Artifacts · Upload Benchmark Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-results
          path: benchmark_output.txt
          retention-days: 90

  docs:
    name: Documentation · Validate
    # Every run builds the site, so a broken symbol link fails the change that made it; main's runs hand it to
    # Documentation · Publish.
    runs-on: macos-26
    needs: ci
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Setup · Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache · Restore SwiftPM
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: csvcoder-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: csvcoder-${{ github.job }}-${{ runner.os }}-

      - name: Documentation · Build
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target CSVCoder \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path CSVCoder \
            --output-path ./docs

      - name: Documentation · Rename Colons (NTFS)
        run: |
          find docs -name '*:*' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            mv "$file" "$(echo "$file" | tr ':' '_')"
          done || true

      - name: Artifacts · Upload Documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation
          path: docs
          retention-days: 30

      - name: Artifacts · Upload Pages Site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./docs

  docs-publish:
    name: Documentation · Publish
    # Deploys the site Documentation · Validate built: the github-pages environment (main only) is entered by
    # main's runs alone, so a pull request never asks for it.
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys without cancelling an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Documentation · Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    name: Release · Publish
    runs-on: macos-26
    needs: [prepare-release, benchmarks]
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write # the tag and the release
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Artifacts · Download Benchmark Results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: benchmark-results

      - name: Release · Create Tag
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare-release.outputs.tag }}" -m "Release ${{ needs.prepare-release.outputs.version }}" || true
          git push origin "${{ needs.prepare-release.outputs.tag }}" || true

      - name: Release · Write Notes
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"

          cat > release_notes.md << RELEASE_EOF
          ## CSVCoder ${VERSION}

          ${{ needs.prepare-release.outputs.changelog }}

          ---

          ### Benchmark Results

          <details>
          <summary>Click to expand benchmark results</summary>

          \`\`\`
          $(cat benchmark_output.txt)
          \`\`\`

          </details>

          ---

          ### Installation

          **Swift Package Manager:**
          \`\`\`swift
          dependencies: [
              .package(url: "https://github.com/g-cqd/CSVCoder.git", from: "${VERSION}")
          ]
          \`\`\`

          RELEASE_EOF

      - name: Release · Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: CSVCoder ${{ needs.prepare-release.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.version, 'alpha') || contains(needs.prepare-release.outputs.version, 'beta') || contains(needs.prepare-release.outputs.version, 'rc') }}
          files: |
            benchmark_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
