name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        type: boolean
        default: false
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write

env:
  XCODE_VERSION: '26.6'
  SWA_VERSION: '0.0.23'

jobs:
  # ============================================================================
  # STAGE 1: Setup & Code Quality Checks (parallel)
  # ============================================================================
  format-check:
    name: Format Check
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Check Formatting
        run: |
          swift format lint --strict --parallel --ignore-unparsable-files \
            --recursive Sources Tests

  static-analysis:
    name: Static analysis (deadwood, dolly, arcleak)
    # Gates, unlike the SwiftStaticAnalysis jobs it replaces (both ran with continue-on-error, so they never
    # failed a build). Tool versions and archive hashes are pinned in Scripts/analyzers.sh; dolly compares
    # against .dolly-baseline.json, so only a NEW clone fails. The tools read source, so Linux is enough.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run the analyzers
        run: Scripts/analyzers.sh

  formal:
    name: Formal models (TLA+ and Lean)
    # Re-checks Formal/: the streaming protocol in TLC (the broken design must still deadlock, the shipped one
    # must hold) and the SWAR proofs in Lean. Pinned in Scripts/formal.sh and Formal/lean-toolchain.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Lean (elan)
        run: |
          curl -fsSL --retry 3 -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          # elan v4.2.4, by commit
          sh elan-init.sh -y --default-toolchain "$(cat Formal/lean-toolchain)" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the models
        run: Scripts/formal.sh

  # ============================================================================
  # STAGE 2: Build & Test
  # ============================================================================
  test:
    name: Test
    runs-on: macos-26
    needs: [format-check, static-analysis, formal]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache SPM Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -c release

      - name: Run Tests with Coverage
        run: swift test --parallel --enable-code-coverage

      - name: Generate Coverage Report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)
          PROFDATA_PATH=$(find .build -name 'default.profdata' -type f | head -1)

          if [[ -n "$XCTEST_PATH" && -n "$PROFDATA_PATH" ]]; then
            EXEC_NAME=$(basename "$XCTEST_PATH" .xctest)
            EXEC_PATH="$XCTEST_PATH/Contents/MacOS/$EXEC_NAME"

            xcrun llvm-cov export \
              "$EXEC_PATH" \
              -instr-profile="$PROFDATA_PATH" \
              -format=lcov \
              -ignore-filename-regex='.build|Tests|Fixtures|Benchmarks' \
              > coverage.lcov

            xcrun llvm-cov report \
              "$EXEC_PATH" \
              -instr-profile="$PROFDATA_PATH" \
              -ignore-filename-regex='.build|Tests|Fixtures|Benchmarks' \
              > coverage.txt

            echo "Coverage Summary:"
            cat coverage.txt
          else
            echo "Could not find xctest or profdata files"
          fi
        continue-on-error: true

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: |
            coverage.lcov
            coverage.txt
          retention-days: 30
        continue-on-error: true

  test-release:
    name: Test (release, optimized)
    # Shipping builds are optimized, and the performance-sensitive tests assert on optimized code, so the
    # suite also runs there. @testable needs the flag; `swift build --build-tests -c release` does not work.
    runs-on: macos-26
    needs: [format-check, static-analysis, formal]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache SPM Dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Run Tests
        run: swift test -c release --enable-testable-imports

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    needs: [test, test-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: 'generic/platform=iOS Simulator'
          - platform: macOS
            destination: 'platform=macOS'
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: watchOS
            destination: 'generic/platform=watchOS Simulator'
          - platform: visionOS
            destination: 'generic/platform=visionOS Simulator'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Restore SPM Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Xcode 26.6 builds package dependencies with -suppress-warnings, and Aemi's targets also pass
      # -warnings-as-errors, which the driver rejects ("conflicting options"). Keeping warnings on for
      # dependencies removes the conflict; the other variant tried, SWIFT_TREAT_WARNINGS_AS_ERRORS=NO, did not.
      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme CSVCoder \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_SUPPRESS_WARNINGS=NO

  # ============================================================================
  # STAGE 3: Prepare Release, Documentation (after tests)
  # ============================================================================
  # NOTE: CodeQL is handled by GitHub's "Default setup" (repo Settings →
  # Code security and analysis → CodeQL → Default). A workflow-defined
  # CodeQL job conflicts with the default setup ("CodeQL analyses from
  # advanced configurations cannot be processed when the default setup
  # is enabled") and was removed here. To switch back to an advanced
  # configuration, first disable the default setup in repo settings.

  prepare-release:
    name: Prepare Release
    runs-on: macos-26
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.author.name, 'github-actions'))
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -f ".version" ]]; then
            VERSION="$(tr -d '[:space:]' < .version)"
          else
            echo "No version source found"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag-push trigger for ${TAG} - will create release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} - will create release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${PREVIOUS:+$PREVIOUS..}HEAD"

          {
            echo "content<<EOF"

            FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" --grep="^add" --grep="^new" -i 2>/dev/null | head -20 || echo "")
            if [[ -n "$FEATURES" ]]; then
              echo "### Features"
              echo "$FEATURES"
              echo ""
            fi

            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" -i 2>/dev/null | head -20 || echo "")
            if [[ -n "$FIXES" ]]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            PERF=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^perf" -i 2>/dev/null | head -10 || echo "")
            if [[ -n "$PERF" ]]; then
              echo "### Performance"
              echo "$PERF"
              echo ""
            fi

            OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^perf" --grep="^add" --grep="^new" -i 2>/dev/null | head -15 || echo "")
            if [[ -n "$OTHER" ]]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  benchmarks:
    name: Run Benchmarks
    runs-on: macos-26
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Restore SPM Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run Benchmarks
        id: run
        run: |
          swift run -c release CSVCoderBenchmarks --iterations 3 2>&1 | tee benchmark_output.txt

          {
            echo 'summary<<EOF'
            head -100 benchmark_output.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-results
          path: benchmark_output.txt
          retention-days: 90

  docs:
    name: Build Documentation
    runs-on: macos-26
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Restore SPM Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build Documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target CSVCoder \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path CSVCoder \
            --output-path ./docs

      - name: Fix NTFS Compatibility
        run: |
          find docs -name '*:*' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            mv "$file" "$(echo "$file" | tr ':' '_')"
          done || true

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation
          path: docs
          retention-days: 30

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./docs

  # ============================================================================
  # STAGE 4: Release & Deploy
  # ============================================================================
  release:
    name: Create Release
    runs-on: macos-26
    needs: [prepare-release, benchmarks]
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Benchmark Results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: benchmark-results

      - name: Create Tag
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare-release.outputs.tag }}" -m "Release ${{ needs.prepare-release.outputs.version }}" || true
          git push origin "${{ needs.prepare-release.outputs.tag }}" || true

      - name: Prepare Release Notes
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"

          cat > release_notes.md << RELEASE_EOF
          ## CSVCoder ${VERSION}

          ${{ needs.prepare-release.outputs.changelog }}

          ---

          ### Benchmark Results

          <details>
          <summary>Click to expand benchmark results</summary>

          \`\`\`
          $(cat benchmark_output.txt)
          \`\`\`

          </details>

          ---

          ### Installation

          **Swift Package Manager:**
          \`\`\`swift
          dependencies: [
              .package(url: "https://github.com/g-cqd/CSVCoder.git", from: "${VERSION}")
          ]
          \`\`\`

          RELEASE_EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: CSVCoder ${{ needs.prepare-release.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.version, 'alpha') || contains(needs.prepare-release.outputs.version, 'beta') || contains(needs.prepare-release.outputs.version, 'rc') }}
          files: |
            benchmark_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [test, build-platforms, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
